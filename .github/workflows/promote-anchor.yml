# Flips the public anchor to v4.0 the day its announced effective date passes.
#
# The gap this closes: the hosted verifier builds from `releases/latest` and
# Cloudflare Pages rebuilds on PUSH, not on a release. So at an effective date
# three things must happen together — the release stops being a pre-release, the
# README anchor names the new version, and something pushes — or the public
# calculator keeps serving the PREVIOUS algorithm while the new one is already
# paying people. `verify-live` DETECTS that state; nothing prevented it. This does.
#
# Scheduled, not manual, on purpose: the whole failure mode is a human remembering
# a date a week later. It is idempotent and safe to run every day forever — before
# the date it prints "not due" and stops; after the swap it prints "nothing to do".
#
# 16:00 UTC is chosen so the first eligible run is 2026-09-25T16:00Z, ~55 min after
# the algorithm takes force and ~8 h BEFORE the first distribution that uses it
# (the 00:00 UTC run on 2026-09-26). The public verifier therefore flips ahead of
# the first payout under the new math, not after it.
#
# A failed run emails the repo owner — that is the backstop if the guarded swap
# refuses (e.g. someone edited README.md since it was prepared).
#
# ============================================================================
# DISARMED 2026-09-30, AFTER IT DID ITS JOB. It flipped the anchor to v4.0 on
# 2026-09-26 (commit "docs: the on-chain anchor moves to v4.0"), and every run
# since has printed "anchor already on v4.0 — nothing to do".
#
# Why disarm rather than leave a harmless green no-op: this job is PER-VERSION.
# Its constants below name v4.0 and only v4.0, so a daily green run called
# "promote-anchor" would tell a future reader that anchor promotion is automated
# when the next version is not covered at all. A check that cannot fail is not a
# check, and false coverage is worse than none. The ongoing guard already exists
# and is version-independent: verify-live.yml asserts deployed == releases/latest
# == README anchor, weekly and on every published release.
#
# TO RE-ARM FOR THE NEXT VERSION (the cutover procedure in
# company/operations/REWARD_ALGORITHM_VERSION_MANAGEMENT.md owns this step):
#   1. in scripts/promote-anchor.sh set TAG / EFFECTIVE / ID / POST / PRE_SHA_FILE
#      for the new version;
#   2. write the post-cutover README by hand as anchor/README.<ver>.md and record
#      the CURRENT README's checksum in anchor/README.pre-<ver>.sha256 — the job
#      refuses to act if README.md is not that exact file, so it never guesses;
#   3. restore the `schedule:` block below, picking an hour that lands AFTER the
#      effective instant and BEFORE the first distribution that uses it;
#   4. dispatch it once to see it say "not due", which proves it is wired.
# ============================================================================
name: promote-anchor

on:
  # schedule: re-add when re-arming for a new version — see the block above.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-anchor
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Promote the release and swap the anchor, if due
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/promote-anchor.sh

      - name: Push, so Cloudflare rebuilds
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README unchanged — nothing to push."
            exit 0
          fi
          git config user.name  "geniegenerate-bot"
          git config user.email "noreply@geniegenerate.com"
          git add README.md
          git commit -F - <<'MSG'
          docs: the on-chain anchor moves to v4.0

          The announced effective date has passed, so the hosted verifier must now
          serve v4.0. Cloudflare Pages rebuilds on push, not on a release, which is
          why this commit exists at all.

          The text was prepared and reviewed by hand in anchor/README.v4.0.md on
          2026-09-18; this job only swapped it in, after checking README.md was still
          the exact file that plan was written against.
          MSG
          git push

      - name: Confirm the LIVE page actually moved
        run: |
          set -uo pipefail
          if git log -1 --format=%s | grep -q "anchor moves to v4.0"; then
            echo "Waiting for the Cloudflare Pages rebuild…"
            for i in $(seq 1 10); do
              sleep 45
              if ./scripts/verify-live.sh; then
                echo "live page is serving the announced algorithm"; exit 0
              fi
              echo "  attempt $i: not yet"
            done
            echo "STOP: the live page is still not serving the announced algorithm."
            echo "      The swap and push succeeded; the Pages build is the problem."
            exit 1
          fi
          echo "No swap happened this run — nothing to confirm."
