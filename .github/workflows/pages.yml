# Publishes a REDIRECT-ONLY GitHub Pages site pointing at the canonical
# verifier, https://verify.geniegenerate.com/calculator (Cloudflare Pages,
# built from web/ by scripts/cf-pages-build.sh).
#
# Why a redirect rather than a second copy of the app: this is a trust surface.
# Cloudflare rebuilds on push; this workflow is manual-dispatch only, so a real
# second copy would silently drift and could serve a superseded algorithm to
# someone who believed they were auditing the current one. One canonical origin
# is the correct answer — and a redirect keeps every existing link and bookmark
# working instead of 404ing them.
#
# To restore a full mirror, publish `web/` here again (see git history for the
# previous deploy job) and add a sync trigger — do not leave it manual.
name: deploy-pages-redirect

on:
  workflow_dispatch: # manual-only: run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CANONICAL: https://verify.geniegenerate.com/calculator

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Build redirect site
        run: |
          set -euo pipefail
          mkdir -p site/calculator
          page() {
            cat > "$1" <<HTML
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>GenieGenerate — Reward Calculator has moved</title>
          <link rel="canonical" href="${CANONICAL}">
          <meta http-equiv="refresh" content="0; url=${CANONICAL}">
          <meta name="robots" content="noindex">
          <style>
            body{margin:0;min-height:100vh;display:grid;place-items:center;
                 background:#131009;color:#F4EEE3;text-align:center;padding:24px;
                 font:16px/1.6 "Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
            a{color:#F6921A}
          </style>
          </head>
          <body>
            <main>
              <h1>The Reward Calculator has moved</h1>
              <p>It now lives at its permanent home:<br>
                 <a href="${CANONICAL}">${CANONICAL}</a></p>
              <p>Redirecting you now…</p>
            </main>
          </body>
          </html>
          HTML
          }
          page site/index.html
          page site/calculator/index.html
          page site/404.html   # catch-all for any deeper path
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
